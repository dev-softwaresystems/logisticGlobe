pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 server_tokens off;
 log_format safe escape=json '{"method":"$request_method","status":$status,"duration":$request_time,"requestId":"$request_id"}';
 access_log /dev/stdout safe;
 error_log /dev/stderr warn;
 map $http_upgrade $connection_upgrade { default upgrade; '' close; }
 server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location = /web-health { access_log off; return 200 'up'; }
  location /api/ {
   proxy_pass http://api:3000;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Request-ID $request_id;
   proxy_read_timeout 15s;
   client_max_body_size 100k;
  }
  location /socket.io/ {
   proxy_pass http://api:3000;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection $connection_upgrade;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_read_timeout 75s;
  }
  location /assets/ { try_files $uri =404; expires 1y; }
  location / { expires -1; try_files $uri $uri/ /index.html; }
 }
}
